[build]
command = "node scripts/inline-netlify-wasm.mjs"
publish = "public"
edge_functions = "edge-functions"

# Prompted by the Deploy to Netlify button; see /deployment/edge/ for the full binding list.
[template.environment]
GPROXY_LIBSQL_URL = "Required https:// URL of the libSQL (Turso) database, for example https://your-db-org.turso.io. libsql:// is rejected on edge."
GPROXY_LIBSQL_AUTH_TOKEN = "Required auth token for the GPROXY_LIBSQL_URL database."

# The console is a single-page app. These exact paths are excluded from the
# Edge Function below, so Netlify must serve the SPA entrypoint explicitly.
[[redirects]]
from = "/admin"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/admin/"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/portal"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/portal/"
to = "/index.html"
status = 200
force = true

[[edge_functions]]
function = "gproxy"
path = "/*"
excludedPath = [
  "/",
  "/admin",
  "/admin/",
  "/portal",
  "/portal/",
  "/assets/*",
  "/favicon.svg",
]
