name: Sync latest gproxy Netlify release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - deploy
    paths:
      - ".github/workflows/sync-gproxy-netlify.yml"

permissions:
  contents: write

concurrency:
  group: sync-gproxy-netlify
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0

      - name: Sync latest official Netlify release bundle
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/LeenHawk/gproxy/releases/latest"
          release_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' "$api")"
          release_tag="$(jq -r '.tag_name' <<<"$release_json")"
          asset_url="$(jq -r '.assets[] | select(.name == "gproxy-edge-netlify.zip") | .browser_download_url' <<<"$release_json")"

          if [[ -z "$release_tag" || "$release_tag" == "null" ]]; then
            echo "Could not determine latest upstream release tag." >&2
            exit 1
          fi
          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "Latest release $release_tag has no gproxy-edge-netlify.zip asset." >&2
            exit 1
          fi

          current_release="$(cat .gproxy-upstream 2>/dev/null || true)"
          if [[ "$current_release" == "$release_tag" ]]; then
            echo "Already synchronized with upstream release $release_tag."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          curl -fsSL "$asset_url" -o "$tmp_dir/gproxy-edge-netlify.zip"
          unzip -q "$tmp_dir/gproxy-edge-netlify.zip" -d "$tmp_dir/bundle"

          bundle_root="$tmp_dir/bundle"
          if [[ -d "$bundle_root/netlify" ]]; then
            bundle_root="$bundle_root/netlify"
          fi

          test -f "$bundle_root/netlify.toml"
          test -d "$bundle_root/edge-functions"
          test -d "$bundle_root/public"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gproxy-upstream' \
            "$bundle_root/" ./

          printf '%s\n' "$release_tag" > .gproxy-upstream
          printf 'UPSTREAM_RELEASE=%s\n' "$release_tag" >> "$GITHUB_ENV"

      - name: Commit upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No upstream changes to commit."
            exit 0
          fi

          git commit -m "chore: sync gproxy Netlify release ${UPSTREAM_RELEASE}"
          git push origin HEAD:deploy
