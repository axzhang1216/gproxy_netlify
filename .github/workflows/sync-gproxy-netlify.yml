name: Sync upstream gproxy Netlify bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - deploy
    paths:
      - ".github/workflows/sync-gproxy-netlify.yml"

permissions:
  contents: write

concurrency:
  group: sync-gproxy-netlify
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0

      - name: Sync official Netlify bundle
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          git clone --depth 1 --branch deploy https://github.com/LeenHawk/gproxy.git "$tmp_dir/upstream"

          test -f "$tmp_dir/upstream/netlify/netlify.toml"
          test -d "$tmp_dir/upstream/netlify/edge-functions"
          test -d "$tmp_dir/upstream/netlify/public"

          upstream_sha="$(git -C "$tmp_dir/upstream" rev-parse HEAD)"
          upstream_msg="$(git -C "$tmp_dir/upstream" log -1 --pretty=%s)"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$tmp_dir/upstream/netlify/" ./

          printf '%s\n' "$upstream_sha" > .gproxy-upstream
          printf 'UPSTREAM_SHA=%s\n' "$upstream_sha" >> "$GITHUB_ENV"
          printf 'UPSTREAM_MSG=%s\n' "$upstream_msg" >> "$GITHUB_ENV"

      - name: Commit upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Already synchronized with upstream deploy branch."
            exit 0
          fi

          git commit -m "chore: sync gproxy deploy ${UPSTREAM_SHA:0:12}" -m "$UPSTREAM_MSG"
          git push origin HEAD:deploy
